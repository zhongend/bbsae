plugins {
    id 'fabric-loom' version '1.15-SNAPSHOT'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    /*
     * BBS is not on a public Maven. The jar is downloaded from Modrinth and dropped into
     * libs/; this is the same approach BBS-POV uses on 1.20.1.
     */
    modImplementation files("libs/bbs-${project.bbs_version}.jar")

    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.2"
}

test {
    useJUnitPlatform()
}

/*
 * Iris 1.7.6 / Sodium 0.5.13 refuse to start on LWJGL 3.3.2-snapshot. The production launcher
 * uses 3.3.1, but Loom's dev runtime resolves the newer snapshot. This opt-in flag pins the dev
 * runtime to the production LWJGL so an actual Iris + BSL shader regression can be reproduced:
 *
 *   ./gradlew runClientView -PbbsaeIrisTest=true ...
 */
if (project.hasProperty("bbsaeIrisTest"))
{
    configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == "org.lwjgl")
            {
                details.useVersion "3.3.1"
            }
        }
    }
}

loom {
    runs {
        clientTest {
            client()
            programArgs "--quickPlaySingleplayer", "TestWorld"
        }

        clientPreview {
            client()
            vmArg "-Dbbsae.debugPreview=true"
            programArgs "--quickPlaySingleplayer", "TestWorld"
        }

        /*
         * Verification run: opens the compositor and drives it into one state, so the state can be
         * screenshotted. "it compiles" proves nothing about a curve being drawn or a button row
         * overlapping.
         *
         *   ./gradlew runClientView -PbbsaeView=curve|assets|camera|queue
         */
        clientView {
            client()
            vmArg "-Dbbsae.debugPreview=true"
            vmArg "-Dbbsae.debugView=" + (project.findProperty("bbsaeView") ?: "curve")
            vmArg "-Dbbsae.debugReplayWorkspace=" + (project.findProperty("bbsaeReplayWorkspace") ?: "false")
            vmArg "-Dbbsae.debugCurve=true"
            vmArg "-Dbbsae.debugEncoder=true"
            vmArg "-Dbbsae.debugEncoderAe=" + (project.findProperty("bbsaeEncoder") ?: "false")
            vmArg "-Dbbsae.debugAeExport=" + (project.findProperty("bbsaeExport") ?: "false")
            vmArg "-Dbbsae.debugProxy=" + (project.findProperty("bbsaeProxy") ?: "1")
            vmArg "-Dbbsae.debugAudio=" + (project.findProperty("bbsaeAudio") ?: "")
            vmArg "-Dbbsae.debugPlay=" + (project.findProperty("bbsaePlay") ?: "false")
            vmArg "-Dbbsae.debugVideoImport=" + (project.findProperty("bbsaeVideo") ?: "")
            vmArg "-Dbbsae.debugShot=" + (project.findProperty("bbsaeShot") ?: "")
            vmArg "-Dbbsae.debugShotTicks=" + (project.findProperty("bbsaeShotTicks") ?: "260")
            vmArg "-Dbbsae.debugShotEachView=" + (project.findProperty("bbsaeShotEachView") ?: "false")
            vmArg "-Dbbsae.debugShotPrefix=" + (project.findProperty("bbsaeShotPrefix") ?: "round31-")
            vmArg "-Dbbsae.debugReplayComp=" + (project.findProperty("bbsaeReplayComp") ?: "false")
            vmArg "-Dbbsae.debugBridgeCompReplay=" + (project.findProperty("bbsaeBridgeCompReplay") ?: "false")
            vmArg "-Dbbsae.debugBridgeComposite=" + (project.findProperty("bbsaeBridgeComposite") ?: "false")
            vmArg "-Dbbsae.debugReplayBridge=" + (project.findProperty("bbsaeDebugReplayBridge") ?: "false")
            vmArg "-Dbbsae.replayViewMode=" + (project.findProperty("bbsaeReplayView") ?: "camera")
            vmArg "-Dbbsae.debugReplayPlayback=" + (project.findProperty("bbsaePlaybackCheck") ?: "false")
            vmArg "-Dbbsae.replayInteractionScript.disable=" + (project.findProperty("bbsaeReplayScriptOff") ?: "false")
            /* Font verification sheet (see BbsAeClient.saveFontSheet):
             *   ./gradlew runClientView -PbbsaeFontShot=fontsheet -PbbsaeFontShotFont=timesbd.ttf
             * It renders the text through the real composition renderer, which is the only way to
             * see whether the glyphs of an imported font are actually drawn. */
            vmArg "-Dbbsae.debugFontShot=" + (project.findProperty("bbsaeFontShot") ?: "")
            vmArg "-Dbbsae.debugFontShotTicks=" + (project.findProperty("bbsaeFontShotTicks") ?: "140")
            vmArg "-Dbbsae.debugFontShotFont=" + (project.findProperty("bbsaeFontShotFont") ?: "timesbd.ttf")
            vmArg "-Dbbsae.debugFontImportSrc=" + (project.findProperty("bbsaeFontImportSrc") ?: "")
            vmArg "-Dbbsae.debugFontShotSize=" + (project.findProperty("bbsaeFontShotSize") ?: "54")
            vmArg "-Dbbsae.debugFonts=" + (project.findProperty("bbsaeDebugFonts") ?: "false")
            vmArg "-Dbbsae.debugQuitAfterShot=" + (project.findProperty("bbsaeQuitAfterShot") ?: "false")
            vmArg "-Dbbsae.debugExpandEffects=" + (project.findProperty("bbsaeExpandEffects") ?: "false")
            vmArg "-Dbbsae.debugInspectorPage=" + (project.findProperty("bbsaeInspectorPage") ?: "")
            vmArg "-Dbbsae.debugSelectLayer=" + (project.findProperty("bbsaeSelectLayer") ?: "")
            vmArg "-Dbbsae.debugOnlyLayer=" + (project.findProperty("bbsaeOnlyLayer") ?: "")
            vmArg "-Dbbsae.debugCube2D=" + (project.findProperty("bbsaeCube2D") ?: "false")
            vmArg "-Dbbsae.debugFilmId=" + (project.findProperty("bbsaeFilmId") ?: "A2(MAIN)_")
            vmArg "-Dbbsae.debugModelLog=" + (project.findProperty("bbsaeModelLog") ?: "false")
            vmArg "-Dbbsae.debugFilmTime=" + (project.findProperty("bbsaeFilmTime") ?: "2")
            vmArg "-Dbbsae.debugEntityStage=" + (project.findProperty("bbsaeEntityStage") ?: "false")
            vmArg "-Dbbsae.debugOnlyEntityLayer=" + (project.findProperty("bbsaeOnlyEntityLayer") ?: "false")
            vmArg "-Dbbsae.debugHideWorldPlate=" + (project.findProperty("bbsaeHideWorldPlate") ?: "false")
            vmArg "-Dbbsae.debugOpenEffectLibrary=" + (project.findProperty("bbsaeOpenEffectLibrary") ?: "false")
            vmArg "-Dbbsae.debugGizmo3D=" + (project.findProperty("bbsaeDebugGizmo3D") ?: "false")
            /* Dock-layout diagnostics: logs panel rectangles when a dock flex pass settles. */
            vmArg "-Dbbsae.debugDock=" + (project.findProperty("bbsaeDebugDock") ?: "false")
            /* Depth-plane A/B: forces per-pixel depth for one client run without touching prefs. */
            vmArg "-Dbbsae.debugForceDepthPlane=" + (project.findProperty("bbsaeForceDepthPlane") ?: "false")
            vmArg "-Dbbsae.gizmoMode=" + (project.findProperty("bbsaeGizmoMode") ?: "move")
            vmArg "-Dbbsae.keyframeRowHeight=" + (project.findProperty("bbsaeKeyframeRowHeight") ?: "0")
            vmArg "-Dbbsae.keyframeZoomSteps=" + (project.findProperty("bbsaeKeyframeZoomSteps") ?: "0")
            vmArg "-Dbbsae.debugProject=" + (project.findProperty("bbsaeDebugProject") ?: "")
            vmArg "-Dbbsae.debugCameraPreview=" + (project.findProperty("bbsaeDebugCameraPreview") ?: "false")
            vmArg "-Dbbsae.debugNoDepthPlane=" + (project.findProperty("bbsaeNoDepthPlane") ?: "false")
            vmArg "-Dbbsae.debugCompShot=" + (project.findProperty("bbsaeCompShot") ?: "")
            vmArg "-Dbbsae.debugShape=" + (project.findProperty("bbsaeShape") ?: "s3d_cube")
            vmArg "-Dbbsae.debugMeshLog=" + (project.findProperty("bbsaeMeshLog") ?: "false")
            vmArg "-Dbbsae.debugAllShapes=" + (project.findProperty("bbsaeAllShapes") ?: "false")
            vmArg "-Dbbsae.debugDumpSurface=" + (project.findProperty("bbsaeDumpSurface") ?: "false")
            vmArg "-Dbbsae.debugCompShotTicks=" + (project.findProperty("bbsaeCompShotTicks") ?: "300")
            vmArg "-Dbbsae.debugWindow=" + (project.findProperty("bbsaeWindow") ?: "")
            vmArg "-Dbbsae.debugInspectorScroll=" + (project.findProperty("bbsaeInspectorScroll") ?: "")
            programArgs "--quickPlaySingleplayer", "TestWorld"
            /* The panel is laid out for a 1920x1080 editor canvas. The default tiny dev window
             * (854x480) clips the timeline and the quick panel, which makes verification
             * screenshots lie about overlap. */
            programArgs "--width", "1920", "--height", "1080"
        }
    }
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(Test).configureEach {
    if (project.hasProperty("bbsaeThumbs"))
    {
        systemProperty "bbsae.thumbs", "true"
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
